# Configuração do teams-recorder. Sem segredos aqui; a chave da API fica no .env.

[paths]
# Deixe vazio para o padrão: ./data, ou ~/Library/Application Support/teams-recorder
# quando a pasta do projeto estiver sincronizada com o iCloud.
data_dir = ""

[audio]
# Microfone: "default" segue a entrada padrão do sistema (recomendado: funciona com headset),
# ou o nome exato do dispositivo (ex.: "MacBook Air Microphone").
mic_device = "default"
# Backend do microfone: "coreaudio" (teams-tap --mic, sobrevive à reconfiguração feita pelo Teams)
# ou "ffmpeg" (avfoundation; parou de gravar segundos após o Teams abrir o microfone).
mic_backend = "coreaudio"
teams_process_name = "MSTeams"
bitrate_kbps = 64

[detector]
poll_seconds = 3
start_after_positive_polls = 2
stop_after_negative_polls = 5

[transcription]
# Modelo ggml do whisper.cpp. "large-v3-turbo-q5_0" (574 MB) tem qualidade próxima do
# large-v3-turbo completo (1,6 GB). Baixe com scripts/download-model.sh.
whisper_model = "large-v3-turbo-q5_0"
language = "pt"
# Pasta dos modelos; vazio = <data_dir>/models
models_dir = ""
# Threads do whisper; 0 = automático (núcleos de desempenho)
threads = 0

[llm]
# provider: "api" usa a Claude API com a chave do .env (pré-pago por uso);
#           "claude-code" usa o Claude Code instalado, em modo headless, com a sua assinatura.
# Pode ser sobrescrito pela variável de ambiente TREC_LLM_PROVIDER.
provider = "api"
model = "claude-opus-5-5"
# Modelo quando provider = "claude-code" (aceita apelidos: opus, sonnet, fable)
cli_model = "opus"
effort = "high"
max_tokens = 16000

[planner]
hour = 18
retention_days = 30
