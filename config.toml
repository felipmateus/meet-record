# teams-recorder configuration. No secrets here; the API key lives in .env.

[paths]
# Where recordings, plans, models and logs live. A relative path is resolved against the
# project folder. Empty = automatic: ./data, or ~/Library/Application Support/teams-recorder
# when the project is in Documents/Desktop/Downloads or iCloud (macOS can block background
# processes there with "Resource deadlock avoided").
# User decision (2026-10-05): keep the data inside the project.
data_dir = "data"

[audio]
# Microphone: "default" follows the system's default input (recommended: works with a headset),
# or the exact device name (e.g. "MacBook Air Microphone").
mic_device = "default"
# Microphone backend (macOS only): "coreaudio" (teams-tap --mic, survives the reconfiguration done by Teams)
# or "ffmpeg" (avfoundation; stopped recording seconds after Teams opened the microphone).
mic_backend = "coreaudio"
teams_process_name = "MSTeams"
# Windows: the Teams process; the root of its process tree is captured.
teams_process_name_windows = "ms-teams.exe"
bitrate_kbps = 64
# Raw WAV tracks while recording: 16 (integer, default; about 1 GB per hour of meeting) or
# 32 (float; about 2 GB per hour). 16-bit is enough for speech and transcription; 32 adds headroom
# but no audible or transcription gain. The final audio.m4a is the same either way.
bit_depth = 16
# Delete audio.m4a of meetings older than this many days that are already transcribed. Was
# [planner] retention_days (still read when this key is absent). The daemon runs it once a day.
retention_days = 30

[detector]
# Reads `pmset -g assertions` every poll_seconds. Recording starts after start_after_positive_polls
# confirmations (~1-2 s after the call starts) and stops after stop_after_negative_polls readings
# without a call (~5 s after hanging up).
poll_seconds = 1
start_after_positive_polls = 1
stop_after_negative_polls = 5

[transcription]
# whisper.cpp ggml model. "large-v3-turbo-q5_0" (574 MB) has quality close to the full
# large-v3-turbo (1.6 GB). Download it with scripts/download-model.sh.
whisper_model = "large-v3-turbo-q5_0"
language = "pt"
# Models folder; empty = <data_dir>/models
models_dir = ""
# whisper threads; 0 = automatic (performance cores)
threads = 0
# Voice activity detection (Silero) before whisper. Off by default: in a test with short
# phrases (2026-10-05) it cut off speech segments and made the text worse; the noise
# reduction in the mix (audio.denoise) is what improved the transcription. To experiment:
# scripts/download-model.sh silero-v5.1.2 and vad = true.
vad = false
vad_model = "silero-v5.1.2"
# Hallucination loops (2026-10-11): in a long meeting held largely in English, whisper repeated one
# line for 59 minutes ("A CIDADE NO BRASIL", 70% of the transcript). max_context is whisper's -mc,
# the text of the previous window it keeps as context: 0 keeps a loop from carrying over (it removed
# that loop and left Portuguese accuracy unchanged); -1 = whisper's default.
max_context = 0
# A transcript is degraded when more than this share of its segments are in repetition loops (the
# same line 5+ times within 30 segments). Healthy meetings measured 0%; the looped one 68%.
max_loop_share = 0.10
# A degraded transcript is transcribed once more with -mc 0 and, with retry_vad, Silero VAD (about
# 30% slower; needs the VAD model above); a pass that is not degraded is kept when it has at least 85%
# (fixed, not a setting) of the other's minutes with text, else the one with more text. No retry when the Teams track was recorded at
# the wrong sample rate (VAD cannot repair that). If it is still degraded, it is
# saved marked as such, you get a notification and minutes.md shows a warning.
retry_on_loop = true
retry_vad = true

[llm]
# provider: "api" uses the Claude API with the key from .env (pay-as-you-go);
#           "claude-code" uses the installed Claude Code, in headless mode, with your subscription.
# Can be overridden by the TREC_LLM_PROVIDER environment variable.
provider = "claude-code"
model = "claude-opus-5-5"
# Model when provider = "claude-code" (accepts aliases: opus, sonnet, fable)
cli_model = "opus"
effort = "high"
max_tokens = 16000

[verification]
# After each analysis, one more call checks every decision, action, deadline and participant
# against the transcript; what it cannot confirm is kept and marked ⚠️ with the reason, in the
# minutes and the story drafts. Same provider as [llm], smaller model.
# A degraded transcript, or one from a Teams track recorded at the wrong sample rate, is not
# checked (it would confirm its own hallucinations): its banner says so. false = no extra call
# (the two checks done in code, sensitive data and unheard participants, still run).
enabled = true
model = "claude-sonnet-5-5"   # with provider = "api"
cli_model = "sonnet"          # with provider = "claude-code"
effort = "medium"

[user]
# Your name as people say it in meetings. Sent to the model so tasks addressed to you by
# name ("Felipe, você fica com...") are attributed to you. Empty = not sent.
name = "Felipe"

[confirmation]
# When a call starts, a dialog asks whether to keep the recording. Recording starts at once
# either way, so the beginning of the meeting is never lost. "Discard" deletes it and ignores
# the rest of that call; no answer within timeout_seconds keeps it. false = never ask.
enabled = true
timeout_seconds = 30

[speakers]
# Read who is speaking from the Teams meeting window during each recording and label the
# transcript lines with the display names. Needs the teams-speakers helper (scripts/build-native.sh)
# and the Accessibility permission for it (trec doctor tells how). Keep a Teams window visible
# during meetings: a fully covered window stops updating. false = no observer; your own lines are
# still labelled from the microphone track.
enabled = true

[activities]
# After each analyzed meeting, an agent updates data/activities/atividades.md: adds what is new,
# suggests (💬) what was said as done, keeps everything you wrote. false = no automatic curation
# (neither the daemon nor `trec analyze`); the `trec activities` commands still work.
enabled = true
# Models and effort of the curator (leave `model` out to use the [llm] model).
model = "claude-opus-5-5"   # with provider = "api"
cli_model = "opus"          # with provider = "claude-code"
effort = "medium"
# Send a notification when a pass changed something of yours.
notify = true
# Versions kept for `trec activities undo`.
keep_versions = 50

[stories]
# Stories are drafted only for items of data/activities/atividades.md that you tag #história,
# with `trec stories`, into data/plans/<day>.stories.md for you to review; `destinations` and
# `publish` below decide whether they also go to a board.
# Instructions the model always receives when it writes a story (a relative path is resolved
# against the project folder). Drafting fails if this file is missing or empty.
guide = "prompts/user_story_guide.md"
# Where drafted stories go (boards), by name. Available: "backlog-md". Empty = drafts only.
destinations = ["backlog-md"]
# Publish to the destinations right after `trec stories` drafts them.
# false = drafts are published only with `trec publish [--date YYYY-MM-DD] [--only 1,3]`.
publish = false
# Stories of this many previous days are shown to the model so a topic raised again is not
# drafted as a second story.
dedup_days = 30

[stories.backlog_md]
# A Backlog.md project (Markdown kanban: https://github.com/MrLesk/Backlog.md). "." = this
# project folder, with the tasks in ./backlog, which is git-ignored (this repository is public):
# publishing refuses a board that Git would version. One-time setup in the README.
project_dir = "."
# Column where new stories wait for your review; it must exist in the project's statuses.
status = "Triagem"
labels = ["teams-recorder"]
