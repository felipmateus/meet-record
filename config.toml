# teams-recorder configuration. No secrets here; the API key lives in .env.

[paths]
# Where recordings, plans, models and logs live. A relative path is resolved against the
# project folder. Empty = automatic: ./data, or ~/Library/Application Support/teams-recorder
# when the project is in Documents/Desktop/Downloads or iCloud (macOS can block background
# processes there with "Resource deadlock avoided").
# User decision (2026-10-05): keep the data inside the project.
data_dir = "data"

[audio]
# Microphone: "default" follows the system's default input (recommended: works with a headset),
# or the exact device name (e.g. "MacBook Air Microphone").
mic_device = "default"
# Microphone backend: "coreaudio" (teams-tap --mic, survives the reconfiguration done by Teams)
# or "ffmpeg" (avfoundation; stopped recording seconds after Teams opened the microphone).
mic_backend = "coreaudio"
teams_process_name = "MSTeams"
bitrate_kbps = 64

[detector]
# Reads `pmset -g assertions` every poll_seconds. Recording starts after start_after_positive_polls
# confirmations (~1-2 s after the call starts) and stops after stop_after_negative_polls readings
# without a call (~5 s after hanging up).
poll_seconds = 1
start_after_positive_polls = 1
stop_after_negative_polls = 5

[transcription]
# whisper.cpp ggml model. "large-v3-turbo-q5_0" (574 MB) has quality close to the full
# large-v3-turbo (1.6 GB). Download it with scripts/download-model.sh.
whisper_model = "large-v3-turbo-q5_0"
language = "pt"
# Models folder; empty = <data_dir>/models
models_dir = ""
# whisper threads; 0 = automatic (performance cores)
threads = 0
# Voice activity detection (Silero) before whisper. Off by default: in a test with short
# phrases (2026-10-05) it cut off speech segments and made the text worse; the noise
# reduction in the mix (audio.denoise) is what improved the transcription. To experiment:
# scripts/download-model.sh silero-v5.1.2 and vad = true.
vad = false
vad_model = "silero-v5.1.2"

[llm]
# provider: "api" uses the Claude API with the key from .env (pay-as-you-go);
#           "claude-code" uses the installed Claude Code, in headless mode, with your subscription.
# Can be overridden by the TREC_LLM_PROVIDER environment variable.
provider = "claude-code"
model = "claude-opus-5-5"
# Model when provider = "claude-code" (accepts aliases: opus, sonnet, fable)
cli_model = "opus"
effort = "high"
max_tokens = 16000

[user]
# Your name as people say it in meetings. Sent to the model so tasks addressed to you by
# name ("Felipe, você fica com...") are attributed to you. Empty = not sent.
name = "Felipe"

[planner]
hour = 18
retention_days = 30
