[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teams-recorder"
version = "0.1.0"
description = "Records, transcribes and analyzes Microsoft Teams meetings on macOS, generating a daily activity plan."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Felipe Mateus de Carvalho" }]
dependencies = [
  "anthropic>=1.0",
  "pydantic>=2.0",
  "typer>=0.12",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "mypy>=1.10"]

[project.scripts]
trec = "teams_recorder.adapters.inbound.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Coverage is opt-in: `pytest --cov=teams_recorder --cov-report=term-missing`.
# With coverage enabled on the whole suite, the test process gets heavy enough for
# macOS to kill the subprocesses (ffmpeg, fake recorders) on machines with full swap.
addopts = "-q"
markers = ["slow: tests that depend on external binaries (whisper, ffmpeg)"]

[tool.coverage.run]
source = ["teams_recorder"]
branch = false

[tool.mypy]
python_version = "3.11"
files = ["src/teams_recorder"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
